[package]
name = "cellacdc-rs"
version = "0.1.0"
edition = "2021"
description = "CLI-first Rust runner for Cell-ACDC-compatible segmentation outputs"
license = "BSD-3-Clause"

[lib]
name = "cellacdc_rs"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
cellpose-rs = { git = "https://github.com/keejkrej/cellpose-rs.git" }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
ndarray = "0.16"
ndarray-npy = "0.9"
tiff = "0.10"

[dev-dependencies]
image = "0.25"
tempfile = "3.14"
