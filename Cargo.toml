[package]
name = "cellacdc-rs"
version = "0.1.0"
edition = "2021"
description = "CLI-first Rust runner for Cell-ACDC-compatible segmentation outputs"
license = "BSD-3-Clause"

[features]
default = []

[lib]
name = "cellacdc_rs"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
calamine = "0.26"
cellpose-rs = { git = "https://github.com/keejkrej/cellpose-rs.git" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
eframe = "0.31"
evalexpr = "11.3"
hdf5-reader = "0.2"
image = "0.25"
ndarray = "0.16"
ndarray-npy = "0.9"
rfd = "0.15"
rust_xlsxwriter = "0.79"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiff = "0.10"

[dev-dependencies]
tempfile = "3.14"
